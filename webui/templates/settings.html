{% extends "base.html" %}
{% block title %}Kimiko Settings{% endblock %}
{% block content %}
<header class="header">
  <h1>Kimiko Local Settings</h1>
  <p>Runtime configuration synced instantly with the AI core.</p>
</header>

<section class="grid">
  <article class="card">
    <h2>Modules</h2>
    <label>Consciousness modules (comma-separated)</label>
    <input id="consciousnessInput" type="text" placeholder="reflection, planner" />

    <div class="row between">
      <span>Speech Enabled</span>
      <label class="switch">
        <input id="speechEnabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <label>Speech Voice</label>
    <select id="voiceSelect"></select>
    <button id="testVoiceBtn" class="btn subtle">Test Voice</button>

    <div class="row between">
      <span>Minecraft mode</span>
      <label class="switch">
        <input id="minecraftMode" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
  </article>

  <article class="card">
    <h2>Model</h2>
    <p>Ghost avatar</p>
    <img id="ghostPreview" class="ghost-preview" alt="Current ghost" />
    <div id="ghostGrid" class="ghost-grid"></div>
    <label class="upload">
      Upload PNG
      <input id="ghostUpload" type="file" accept=".png" />
    </label>
  </article>

  <article class="card">
    <h2>Memory</h2>
    <label>Context modules (comma-separated)</label>
    <input id="memoryInput" type="text" placeholder="persona, timeline" />
  </article>

  <article class="card">
    <h2>Data</h2>
    <div class="actions">
      <button id="exportBtn" class="btn">Export data</button>
      <button id="deleteBtn" class="btn danger">Delete data</button>
      <button id="resetBtn" class="btn danger">Reset settings</button>
    </div>
  </article>
</section>
{% endblock %}
